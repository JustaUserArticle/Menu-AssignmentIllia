<!DOCTYPE html>
<html>
<head>
    <title>Shortened Menus</title>
    <style>
        body { display: flex; justify-content: center; background: #eee; font-family: sans-serif; }
        .menu {
            width: 400px;
            height: 550px;
            margin: 20px;
            padding: 50px;
            border: 10px solid #fff;
        }
         background-color: #fff;
            text-align: center;
            overflow: hidden; /* Чтобы картинка не вылезала за рамку */
            display: flex;
            flex-direction: column;

        h1 { border-bottom: 2px solid; margin-bottom: 30px; padding-bottom: 10px; }
        p { font-size: 1.2em; margin: 15px 0; }
    </style>
</head>
<body>

    <div class="menu br">
        <div class="content">
            <img src="image1.jpg" alt="image1.jpg"> </img>
            <h1>Breakfast</h1>
            <p>Fried Eggs & Bacon - $12</p>
            <p>French Toast - $10</p>
            <p>Hot Tea - $3</p>
        </div>
    </div>

    <div class="menu ln">
        <div class="content">
            <img src="image2.jpg" alt="image2.jpg"> </img>
            <h1>Lunch</h1>
            <p>Chicken Caesar - $14</p>
            <p>Vegetable Soup - $8</p>
            <p>Orange Juice - $5</p>
        </div>
    </div>

    <div class="menu dn">
        <div class="content">
            <img src="image3.jpg" alt="image3.jpg"> </img>
            <h1>Dinner</h1>
            <p>Grilled Salmon - $22</p>
            <p>Steak - $16</p>
            <p>Red Wine - $15</p>
        </div>
    </div>
</body>
</html>
