<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Menu</title>
    <style>
        body { display: flex; justify-content: center; background: #f0f0f0; margin: 0; padding: 50px; font-family: sans-serif; }
        
        .menu {
            width: 400px;
            height: 550px;
            margin: 20px;
            padding: 40px;
            border: 8px solid #333;
            box-sizing: border-box;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: white;
            text-align: center;
            text-shadow: 2px 2px 8px #000;
        }

        .breakfast { background-image: url('image1.jpg'); }
        .lunch { background-image: url('image2.jpg'); }
        .dinner { background-image: url('image3.jpg'); }

        h1 { border-bottom: 2px solid white; padding-bottom: 10px; margin-bottom: 30px; }
        p { font-size: 20px; margin: 15px 0; font-weight: bold; }
    </style>
</head>
<body>

    <div class="menu breakfast">
        <h1>Breakfast</h1>
        <p>Fried Eggs - $10</p>
        <p>Pancakes - $12</p>
        <p>Coffee - $4</p>
    </div>

    <div class="menu lunch">
        <h1>Lunch</h1>
        <p>Beef Burger - $15</p>
        <p>Tomato Soup - $8</p>
        <p>Iced Tea - $5</p>
    </div>

    <div class="menu dinner">
        <h1>Dinner</h1>
        <p>Grilled Steak - $25</p>
        <p>Pasta - $18</p>
        <p>Red Wine - $12</p>
    </div>

</body>
</html>
